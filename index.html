<style>
/* Layout: one pixel stage (288x200 art pixels) scaled to fit; HTML overlays sized in art-pixel units (--u). */
:root {
  --u: 4px;
  --ink: #2C1A1E; --night: #1E0F14; --plum: #612C48; --pumpkin: #C97034; --gold: #DCA438;
  --parch: #F4EBD9; --parch-edge: #D8C2A7; --cream: #FFF1C8; --moss: #5D6A3E;
  --font: 'Pixelify Sans', ui-rounded, 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: #140A0E; color: var(--cream); overflow: hidden; font-family: var(--font);
  touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
#app { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #2A1420 0%, #140A0E 70%); }
#stage { position: relative; overflow: hidden; background: var(--night); box-shadow: 0 0 0 calc(var(--u) * 1) var(--ink); }
#game { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
canvas.pix { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
button { font-family: var(--font); cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: calc(var(--u) * 1) solid var(--gold); outline-offset: calc(var(--u) * 0.5); }

/* ---------- dialog (Earthbound-style window) ---------- */
#dlg { position: absolute; z-index: 10; left: calc(var(--u) * 30); right: calc(var(--u) * 30); top: calc(var(--u) * 6);
  min-height: calc(var(--u) * 24); padding: calc(var(--u) * 5) calc(var(--u) * 8) calc(var(--u) * 5);
  background: var(--night); color: var(--cream); border-radius: calc(var(--u) * 2.5);
  box-shadow: inset 0 0 0 calc(var(--u) * 1) var(--plum), 0 0 0 calc(var(--u) * 1) var(--parch), 0 0 0 calc(var(--u) * 2) var(--ink), 0 calc(var(--u) * 2) 0 calc(var(--u) * 2) rgba(0,0,0,.35);
  font-size: calc(var(--u) * 7.5); line-height: 1.32; letter-spacing: 0.01em; cursor: pointer; }
#dlg.bottom { top: auto; bottom: calc(var(--u) * 6); }
#dlgName { position: absolute; top: calc(var(--u) * -5); left: calc(var(--u) * 7); background: var(--pumpkin); color: var(--night);
  font-size: calc(var(--u) * 5.5); font-weight: 700; padding: 0 calc(var(--u) * 3); border-radius: calc(var(--u) * 1.5);
  box-shadow: 0 0 0 calc(var(--u) * 1) var(--ink); letter-spacing: 0.04em; }
#dlgText .ghost { color: transparent; }
#dlgText .bul { color: var(--pumpkin); margin-right: calc(var(--u) * 2.5); }
#dlg.narr #dlgText { color: #F6E2C0; }
#dlgMore { position: absolute; right: calc(var(--u) * 5); bottom: calc(var(--u) * 1.5); font-size: calc(var(--u) * 5); color: var(--pumpkin); animation: bob 0.8s steps(2) infinite; }
#dlgOpts { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 3); margin-top: calc(var(--u) * 4); }
.opt { font-size: calc(var(--u) * 6.5); color: var(--night); background: var(--cream); border: 0; text-align: left;

let lastT = performance.now();

    zoe.update(dt);
    for (const a of scene.actors || []) if (a !== zoe) a.update(dt);
    if (scene.update) scene.update(dt);

  }

}

function drawFire(g, x, y, t, k) {
  if (k <= 0) return;
  const rows = 22;
  for (let i = 0; i < rows; i++) {
    const yy = y - i;
    const w = Math.max(0, (12 - i * 0.45 + Math.sin(t * 9 + i * 0.7) * 2.2) * k);
    const off = Math.sin(t * 6 + i * 0.5) * (i * 0.15);
    const c = i < 4 ? '#FFF6C8' : i < 9 ? '#FFD84A' : i < 15 ? '#FE9B5B' : '#C97034';
    if (w > 0.5) D.r(g, x - w + off, yy, w * 2, 1, c);
    if (i < 12 && w > 3) D.r(g, x - w * 0.4 + off, yy, w * 0.8, 1, i < 6 ? '#FFFFFF' : '#FFF6C8');
  }
  // tongues
  for (let j = 0; j < 4; j++) {
    const fx = x - 8 + j * 5 + Math.sin(t * 4 + j) * 1.5, h = (6 + ((Math.sin(t * 7 + j * 2) + 1) * 4)) * k;
    for (let i = 0; i < h; i++) D.p(g, fx + Math.sin(t * 10 + i + j) * 0.8, y - 14 * k - i, i < h / 2 ? '#FE9B5B' : '#C97034');
  }
  D.glow(g, x, y - 6, 60, '#FF9A3A', 0.3 * k * (0.9 + 0.1 * Math.sin(t * 13)), 5);
}

    }
    // items
    if (save.item === 'beanbag' || this.preview === 'beanbag') {
      if (this.preview === 'beanbag') g.globalAlpha = 0.55 + 0.25 * Math.sin(T * 8);
      drawBeanbag(g, LIB.beanbag[0], LIB.beanbag[1], Math.round(this.squash));
      g.globalAlpha = 1;
    }
    if (save.item === 'headphones' && !this.dj) drawHeadphonesItem(g, LIB.table[0], LIB.table[1] - 2);
    if (this.preview === 'headphones') { g.globalAlpha = 0.55 + 0.25 * Math.sin(T * 8); drawHeadphonesItem(g, LIB.table[0], LIB.table[1] - 3); g.globalAlpha = 1; }
    // presents
    if (this.presents) for (const p of this.presents) if (!p.gone) {
      drawPresent(g, p.x, p.y, p.wrap, p.ribbon, p.lid);
      if (p.peeked && !p.lid) { D.r(g, p.x + 5, p.y - 6, 4, 4, C.parch); D.p(g, p.x + 6, p.y - 5, C.ink); }
    }
  },
  drawFg(g) {
    if (save.item === 'lights' || this.preview === 'lights') {
      if (this.preview === 'lights') g.globalAlpha = 0.5 + 0.3 * Math.sin(T * 8);
      drawLights(g, T, this.preview === 'lights' ? 1 : this.lightsK);
      g.globalAlpha = 1;
    }
    if (this.storyIcon) {
      const ic = ICONS['a_' + this.storyIcon];
      const y = Math.round(zoe.y - 56 + Math.sin(T * 2) * 1.5);
      D.glow(g, zoe.x, y + 11, 18, '#FFE38A', 0.3, 3);
      g.drawImage(ic, Math.round(zoe.x - 11), y);
    }
    if (this.flyBook) {
      const f = this.flyBook, t = ease(f.t);
      const x = lerp(f.x, f.to[0], t), y = lerp(f.y, f.to[1], t) - Math.sin(t * Math.PI) * (f.quest ? 20 : 40);
      if (f.quest) { drawShelfBook(g, x, y, false); }
      else { D.glow(g, x + 12, y + 12, 22, '#FFE38A', 0.35, 3); drawBookCover(g, Math.round(x), Math.round(y), f.animal); if (Math.random() < 0.5) emit({ kind: 'spark', x: x + 12, y: y + 12, vy: 6, life: 0.6, c: '#FFF6B8', layer: 'front' }); }
    }
  },
  update(dt) {
    if (this.squash > 0) this.squash = Math.max(0, this.squash - dt * 6);
    const done = this.reveal >= 340;
    if (done && Math.random() < dt * 3) emit({ kind: 'spark', x: LIB.fire[0] + (Math.random() - 0.5) * 16, y: 132, vy: -20 - Math.random() * 20, vx: (Math.random() - 0.5) * 8, life: 1, c: '#FFC060' });
    if (done && Math.random() < dt * 6) AU.sfx('crackle');
    if (!done && Math.random() < dt * 2) emit({ kind: 'mote', x: 20 + Math.random() * 250, y: 40 + Math.random() * 120, life: 5, c: '#B8B2C4', a: 0.6 });
    if (this.dj && Math.random() < dt * 1.5) emit({ kind: 'note', x: this.dj.x + (Math.random() - 0.5) * 8, y: this.dj.y - 14, vy: -10, vx: (Math.random() - 0.5) * 6, life: 1.4, c: ['#E8628A', '#FFD84A', '#9ACDE0'][Math.floor(Math.random() * 3)], layer: 'front' });
    if (save.stage === 'quest' && !isBusy() && !Dlg.active && !Modal.open) {
      this.waitT = (this.waitT || 8) - dt;
      if (this.waitT < 0) {
        this.waitT = 12 + Math.random() * 8;
        const s = this.sps[Math.floor(Math.random() * this.sps.length)];
        bubble(s, cycle(['Is she back yet?', 'How about now?', "I'm practicing waiting.", 'Greg, are we there yet?', 'I love waiting! (I do not.)', 'Zzz...'], 'wait', this.st), 2200);
      }
    }
  },
  start(o = {}) {
    if (save.stage === 'met') {
      cut(async () => {
        await zoe.walkTo(72, 186); zoe.face(1);
        const G = this.greg, S = this.sps;
        await say('greg', 'Welcome to the library!');
        G.expr = 'sad';
        await say('greg', 'It used to be nicer.');
        await say('sp', 'And warmer.', { actor: S[0] });
        await say('sp2', 'And it had books in it.', { actor: S[1] });
        await say('greg', 'Books would be good, yes.');
        await say('greg', 'When the stories stopped coming, the fire went out.');
        await say('greg', 'And everything got... blah.');
        await say('sp3', 'Blah.', { actor: S[4] });
        G.expr = 'happy';
        await say('greg', 'But you can fix it, {name}!');
        await say('greg', 'The bookshelf always knows what to do. Give it a tap.');
        save.stage = 'library'; persist();
      });
    } else if (save.stage === 'quest' && !o.arrive) {
      cut(async () => {
        FX.fade = 1; await fadeIn(600);
        this.greg.expr = 'happy';
        await say('greg', '{name}! You are back!');
        await say('greg', 'Did you read your animal book? Sit on the storytelling stool by the fire and tell us everything.');
        this.greg.expr = 'norm';
      });
    } else if (save.stage === 'reward') {
      cut(async () => { FX.fade = 1; await fadeIn(500); await this.reward(); });
    } else if (!o.arrive) { FX.fade = 1; fadeIn(500); }
  },
};
// record tap x for present picking
stage.addEventListener('pointerdown', (e) => { if (scene === SCENES.library) { const [x] = stageToWorld(e); SCENES.library._tapX = x; } }, true);

// ===================== HUD =====================
function updateHud(newQuest) {
  const onTitle = scene === SCENES.title;
  $('#hud').hidden = onTitle;
  const q = $('#hQuest');
  q.hidden = save.stage !== 'quest';
  if (newQuest) { q.classList.remove('pulse'); void q.offsetWidth; q.classList.add('pulse'); }
  $('#hMusic').classList.toggle('off', !AU.musicOn);
}
function mountHud() {
  $('#hQuest').append(pixImg(ICONS.scroll, 1, 'hicon'));
  $('#hMusic').append(pixImg(ICONS.note, 1, 'hicon'));
  $('#hQuest').addEventListener('click', async () => {
    if (isBusy() || Dlg.active || Modal.open) return;
    AU.sfx('page');
    const r = await openQuestPage(true);
    if (r === 'done' && scene === SCENES.library) {
      const hs = SCENES.library.hotspots.find((h) => h.when && h.rect && h.rect[0] === 170 && h.when());
      if (hs) runHotspot(hs);
    }
  });
  $('#hMusic').addEventListener('click', () => { AU.init(); AU.setMusic(!AU.musicOn); save.musicOn = AU.musicOn; persist(); updateHud(); });
}

// ===================== Overlays =====================
function speakBtn() { return null; }
function card(cls, ...kids) { return h('div', { class: 'card ui ' + cls }, ...kids); }

async function openMirror() {
  const L = save.look;
  const prev = h('div', { class: 'mirror-glass' });
  const redraw = () => { zoe.rebuild(); prev.innerHTML = ''; prev.append(pixImg(zoe.F.front, 3, 'mirror-zoe')); };
  const row = (label, items, key) => {
    const wrap = h('div', { class: 'mrow' }, h('div', { class: 'mlabel' }, label));
    const btns = h('div', { class: 'mbtns' });
    items.forEach((it, i) => {
      const b = h('button', { class: 'sw' + (L[key] === i ? ' on' : ''), type: 'button', 'aria-label': `${label} ${i + 1}` });
      if (it.color) b.style.background = it.color; else b.append(it.node);
      b.addEventListener('click', () => { L[key] = i; AU.sfx('tap'); [...btns.children].forEach((c, j) => c.classList.toggle('on', j === i)); redraw(); });
      btns.append(b);
    });
    wrap.append(btns);
    return wrap;
  };
  const styleThumb = (i) => { const look = Object.assign({}, L, { hair: i }); const F = zoeFrames(look); const [c, g] = mk(24, 16); g.drawImage(F.front, 0, 0); return pixImg(c, 0.9); };
  const done = h('button', { class: 'big', type: 'button' }, "That's me!");
  const node = card('mirror',
    h('div', { class: 'mframe' }, prev),
    h('div', { class: 'mside' },
      h('div', { class: 'mtitle' }, 'The Mirror ', speakBtn('Tap the buttons to look like you. Then tap, that\'s me!')),
      row('Hair', HAIRS.map((_, i) => ({ node: styleThumb(i) })), 'hair'),
      row('Hair color', HAIRC.map((c) => ({ color: c.h })), 'hairColor'),
      row('Skin', SKINS.map((c) => ({ color: c.s })), 'skin'),
      row('Shirt', SHIRTS.map((c) => ({ color: c.t })), 'shirt'),
      done));
  redraw();
  done.addEventListener('click', () => { AU.sfx('sparkle'); persist(); Modal.close(); });
  Voice.say('Tap the buttons to look like you.', 'n');
  await Modal.show(node, 'dim');
  zoe.rebuild();
}

async function openQuestPage(fromHud) {
  const steps = h('ol', { class: 'qsteps' },
    h('li', {}, pixImg(ICONS.magnifier, 1.2), h('span', {}, 'Find it.')),
    h('li', {}, pixImg(ICONS.openbook, 1.1), h('span', {}, 'Read it.')),
    h('li', {}, pixImg(ICONS.talk, 1.2), h('span', {}, 'Tell the Sparkees all about it.')));
  const read = 'The Animal Book Hunt. Somewhere in your house, there is a book with an animal on the cover. Find it. Read it. Then come back and tell the Sparkees all about it.';
  const btns = h('div', { class: 'qbtns' });
  const node = card('quest',
    h('div', { class: 'qkicker' }, 'A quest from the bookshelf ', speakBtn(read)),
    h('h2', {}, 'The Animal Book Hunt'),
    h('p', { class: 'qlead' }, 'Somewhere in your house, there is a book with an animal on the cover.'),
    steps,
    h('p', { class: 'qaside' }, '(Grown-ups can help with big words. That is what grown-ups are for.)'),
    btns);
  if (!fromHud) {
    const b = h('button', { class: 'seal', type: 'button' }, pixImg(ICONS.seal, 1.4), h('span', {}, "I'll do it!"));
    b.addEventListener('click', () => { AU.sfx('chime'); Modal.close('ok'); });
    btns.append(b);
  } else {
    const b1 = h('button', { class: 'big', type: 'button' }, 'I read my book!');
    const b2 = h('button', { class: 'ghostbtn', type: 'button' }, 'Not yet');
    b1.addEventListener('click', () => { AU.sfx('tap'); Modal.close('done'); });
    b2.addEventListener('click', () => { AU.sfx('tap'); Modal.close('later'); });
    btns.append(b1, b2);
  }
  AU.sfx('page');
  Voice.say(read, 'n');
  const r = await Modal.show(node, 'dim');
  Voice.stop();
  return r;
}

async function openAnimalPicker() {
  const grid = h('div', { class: 'agrid' });
  const q = 'What animal was on the cover?';
  for (const [k, label] of ANIMALS) {
    const b = h('button', { class: 'acell', type: 'button' }, pixImg(ICONS['a_' + k], 1.25), h('span', {}, label));
    b.addEventListener('click', () => { AU.sfx('sparkle'); Voice.say(label === 'Something else' ? 'A mystery animal!' : 'A ' + label.toLowerCase() + '!', 'sp'); Modal.close(k); });
    grid.append(b);
  }
  const node = card('picker', h('div', { class: 'ptitle' }, q, ' ', speakBtn(q, 'greg')), grid);
  Voice.say(q, 'greg');
  return Modal.show(node, 'dim');
}
async function openFeelingPicker() {
  const q = 'How did the story make you feel?';
  const row = h('div', { class: 'frow' });
  for (const [k, label, ex] of [['funny', 'Funny', 'laugh'], ['exciting', 'Exciting', 'star'], ['cozy', 'Cozy', 'cozy'], ['sad', 'Sad', 'sad']]) {
    const b = h('button', { class: 'fcell', type: 'button' }, pixImg(sparkeeFace(ex), 2.2), h('span', {}, label));
    b.addEventListener('click', () => { AU.sfx('tap'); Voice.say(label, 'sp'); Modal.close(k); });
    row.append(b);
  }
  const node = card('picker feel', h('div', { class: 'ptitle' }, q, ' ', speakBtn(q, 'greg')), row);
  Voice.say(q, 'greg');
  return Modal.show(node, 'dim');
}
function animalName(k) { const a = ANIMALS.find((x) => x[0] === k); return a ? (k === 'other' ? 'a mystery animal' : 'a ' + a[1].toLowerCase()) : 'an animal'; }
async function openChapterCard() {
  AU.sfx('chime');
  const b = save.book || { animal: 'other' };
  const items = ['Found the tiny door', 'Met the Sparkees (and Greg)', `Read a book about ${animalName(b.animal)}`, 'Lit the library fire'];
  const btn = h('button', { class: 'big', type: 'button' }, 'Keep exploring');
  const text = `Chapter one, complete! The library wakes up. Come back tomorrow for a new quest.`;
  const node = card('chapter',
    h('div', { class: 'ckicker' }, 'Chapter One ', speakBtn(text)),
    h('h2', {}, 'The Library Wakes Up'),
    h('ul', { class: 'clist' }, items.map((t) => h('li', {}, h('i', { 'aria-hidden': 'true' }, '✦'), t))),
    h('p', { class: 'cnext' }, 'Come back tomorrow for a new quest. The kitchen smells like cookies.'),
    btn);
  btn.addEventListener('click', () => { AU.sfx('tap'); Modal.close(); });
  Voice.say(text, 'n');
  await Modal.show(node, 'dim');
}
async function openBookCard() {
  const b = save.book; if (!b) return;
  const [c, g] = mk(24, 24); drawBookCover(g, 0, 0, b.animal);
  const feelWord = { funny: 'funny', exciting: 'excited', cozy: 'cozy', sad: 'a little sad' }[b.feel] || 'happy';
  const who = save.name === 'Visitor' ? 'the Visitor' : 'Zoe';
  const text = `A book about ${animalName(b.animal)}. Read by ${who}. It made you feel ${feelWord}. Sparkee rating: nine stars. They don't know when to stop.`;
  const btn = h('button', { class: 'big', type: 'button' }, 'Put it back');
  const node = card('bookcard',
    pixImg(c, 3.2, 'bcover'),
    h('div', { class: 'binfo' },
      h('div', { class: 'ckicker' }, 'On the library shelf ', speakBtn(text)),
      h('h2', {}, `A book about ${animalName(b.animal)}`),
      h('p', {}, `Read by ${who}.`),
      h('p', {}, `It made you feel ${feelWord}.`),
      h('p', { class: 'stars' }, '★★★★★★★★★'),
      h('p', { class: 'qaside' }, "(The Sparkees don't know when to stop.)"),
      btn));
  btn.addEventListener('click', () => { AU.sfx('tap'); Modal.close(); });
  await Modal.show(node, 'dim');
}

// ===================== Title & boot =====================
function routeByStage() {
  const s = save.stage;
  if (s === 'new' || s === 'hallway') return goScene('hall');
  if (s === 'stairs') return goScene('stairs', { arrive: false });
  if (s === 'forest' || s === 'met') return goScene('forest');
  return goScene('library');
}
function showTitle() {
  goScene('title');
  const t = $('#title');
  t.hidden = false;
  const has = save.stage !== 'new';
  $('#bStart').textContent = has ? 'Keep playing' : 'Tap to begin';
  $('#bNew').hidden = !has;
  $('#confirm').hidden = true;
}
function begin() {
  AU.init(); Voice.unlock();
  if (save.musicOn === false) AU.setMusic(false);
  $('#title').hidden = true;
  zoe.rebuild();
  routeByStage();
}
function boot() {
  loadSave();
  AU.musicOn = save.musicOn !== false;
  makeIcons();
  for (const [k] of ANIMALS) ICONS['a_' + k] = animalIcon(k);
  zoe.rebuild();
  mountHud();
  layout();
  $('#bStart').addEventListener('click', (e) => { e.stopPropagation(); begin(); });
  $('#title').addEventListener('pointerdown', (e) => { if (!e.target.closest('button')) { AU.init(); } });
  $('#bNew').addEventListener('click', (e) => { e.stopPropagation(); $('#confirm').hidden = false; $('#tbtns').hidden = true; });
  $('#bYes').addEventListener('click', (e) => { e.stopPropagation(); wipeSave(); for (const k in BG) if (k.startsWith('forest')) delete BG[k]; $('#tbtns').hidden = false; begin(); });
  $('#bNo').addEventListener('click', (e) => { e.stopPropagation(); $('#confirm').hidden = true; $('#tbtns').hidden = false; });
  $('#bAnyway').addEventListener('click', () => { playAnyway = true; layout(); });
  document.addEventListener('visibilitychange', () => {
    if (!AU.ctx) return;
    if (document.hidden) AU.ctx.suspend(); else AU.ctx.resume();
  });
  showTitle();
  requestAnimationFrame(frame);
  window.__dbg = { save, goScene, SCENES, zoe, persist, begin, get scene() { return scene; }, get busy() { return isBusy(); }, Dlg, Modal };
}
boot();
