<style>
/* Layout: one pixel stage (288x200 art pixels) scaled to fit; HTML overlays sized in art-pixel units (--u). */
:root {
  --u: 4px;
  --ink: #2C1A1E; --night: #1E0F14; --plum: #612C48; --pumpkin: #C97034; --gold: #DCA438;
  --parch: #F4EBD9; --parch-edge: #D8C2A7; --cream: #FFF1C8; --moss: #5D6A3E;
  --font: 'Pixelify Sans', ui-rounded, 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: #140A0E; color: var(--cream); overflow: hidden; font-family: var(--font);
  touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
#app { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #2A1420 0%, #140A0E 70%); }
#stage { position: relative; overflow: hidden; background: var(--night); box-shadow: 0 0 0 calc(var(--u) * 1) var(--ink); }
#game { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
canvas.pix { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
button { font-family: var(--font); cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: calc(var(--u) * 1) solid var(--gold); outline-offset: calc(var(--u) * 0.5); }

/* ---------- dialog (Earthbound-style window) ---------- */
#dlg { position: absolute; z-index: 10; left: calc(var(--u) * 30); right: calc(var(--u) * 30); top: calc(var(--u) * 6);
  min-height: calc(var(--u) * 24); padding: calc(var(--u) * 5) calc(var(--u) * 8) calc(var(--u) * 7);
  background: var(--night); color: var(--cream); border-radius: calc(var(--u) * 2.5);
  box-shadow: inset 0 0 0 calc(var(--u) * 1) var(--plum), 0 0 0 calc(var(--u) * 1) var(--parch), 0 0 0 calc(var(--u) * 2) var(--ink), 0 calc(var(--u) * 2) 0 calc(var(--u) * 2) rgba(0,0,0,.35);
  font-size: calc(var(--u) * 7.5); line-height: 1.32; letter-spacing: 0.01em; }
#dlg.bottom { top: auto; bottom: calc(var(--u) * 6); }
#dlgName { position: absolute; top: calc(var(--u) * -5); left: calc(var(--u) * 7); background: var(--pumpkin); color: var(--night);
  font-size: calc(var(--u) * 5.5); font-weight: 700; padding: 0 calc(var(--u) * 3); border-radius: calc(var(--u) * 1.5);
  box-shadow: 0 0 0 calc(var(--u) * 1) var(--ink); letter-spacing: 0.04em; }
#dlgText .ghost { color: transparent; }
#dlgText .bul { color: var(--pumpkin); margin-right: calc(var(--u) * 2.5); }
#dlg.narr #dlgText { color: #F6E2C0; }
#dlgNext { position: absolute; right: calc(var(--u) * 4); bottom: calc(var(--u) * -6); font-size: calc(var(--u) * 6.5); font-weight: 700; color: var(--night);
  background: var(--pumpkin); border: 0; border-radius: calc(var(--u) * 2.5); padding: calc(var(--u) * 1.5) calc(var(--u) * 5);
  box-shadow: 0 0 0 calc(var(--u) * 0.75) var(--ink), 0 calc(var(--u) * 1.25) 0 calc(var(--u) * 0.75) var(--ink); animation: nextIn 0.25s ease-out; }
#dlgNext span { display: inline-block; animation: bob 0.8s steps(2) infinite; }
#dlgNext:active { transform: translateY(calc(var(--u) * 1)); box-shadow: 0 0 0 calc(var(--u) * 0.75) var(--ink); }

const VOICES = {
  n: { pitch: 1.0, rate: 0.95 },

// Read-aloud is switched off on purpose: Zoe reads the game herself.
const Voice = {
  on: false, v: null,
  supported: false,
  pick() {
    if (!this.supported) return;
    const vs = speechSynthesis.getVoices();
    const pref = ['Samantha', 'Ava', 'Allison', 'Karen', 'Moira', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Microsoft Zira'];
    for (const p of pref) { const f = vs.find((v) => v.name.includes(p) && /^en/i.test(v.lang)); if (f) { this.v = f; return; } }
    this.v = vs.find((v) => /^en[-_]US/i.test(v.lang)) || vs.find((v) => /^en/i.test(v.lang)) || null;
  },
  unlock() {
    if (!this.supported) return;
    this.pick();
    speechSynthesis.onvoiceschanged = () => this.pick();
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) { /* ignore */ }
  },
  say(text, who) {
    if (!this.on || !this.supported) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(this.clean(text));
      if (this.v) u.voice = this.v;
      const p = VOICES[who] || VOICES.n;
      u.pitch = p.pitch; u.rate = p.rate;
      setTimeout(() => speechSynthesis.speak(u), 40);
    } catch (e) { /* ignore */ }
  },
  stop() { if (this.supported) try { speechSynthesis.cancel(); } catch (e) { /* ignore */ } },
  clean(t) { return t.replace(/[•*]/g, '').replace(/\.\.\./g, '... ').replace(/\bGREG\b/g, 'Greg'); },
};

  const head = buildSprite(SPR.zoeSideHead, map);

  };
  const F = {
    front: front(SPR.zoeFront),

    cheer: front(SPR.zoeCheerBody, SPR.zoeArmsUp),

    walk: [side(SPR.zoeSideBody.walk1), side(SPR.zoeSideBody.walk2), side(SPR.zoeSideBody.walk3), side(SPR.zoeSideBody.walk2)],
    crouch: side(SPR.zoeSideBody.crouch, true),
  };
  const flipAll = (o) => { const r = {}; for (const k in o) r[k] = Array.isArray(o[k]) ? o[k].map(flipped) : flipped(o[k]); return r; };
  F.left = flipAll({ stand: F.stand, walk: F.walk, crouch: F.crouch });

}

const SPK_CACHE = {};
function genSparkee(r, seed, dim) {
  const rnd = rand(seed * 7919 + r);
  const S = r * 2 + 7, cx = Math.floor(S / 2), cy = Math.floor(S / 2) + 1;
  const m = new Uint8Array(S * S);
  const set = (x, y) => { if (x >= 0 && y >= 0 && x < S && y < S) m[y * S + x] = 1; };
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = x - cx, dy = (y - cy) * 1.08;
    if (dx * dx + dy * dy <= r * r + r * 0.4) set(x, y);
  }
  const tufts = Math.round(r * 2.6);
  for (let i = 0; i < tufts; i++) {
    const a = -Math.PI * (0.05 + rnd() * 0.9) + (rnd() < 0.3 ? Math.PI * (rnd() - 0.5) * 0.6 : 0);
    const len = rnd() < 0.35 ? 2 : 1;
    for (let k = 1; k <= len; k++) set(Math.round(cx + Math.cos(a) * (r + k)), Math.round(cy + Math.sin(a) * (r + k) / 1.08));
  }
  const pal = dim
    ? { hi: '#E9E0BE', base: '#C6B98C', sh: '#9E8C64', line: '#5E5142' }
    : { hi: '#FFF6B8', base: '#FFD84A', sh: '#F0A52C', line: '#7A4410' };
  const [c, g] = mk(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    if (!m[y * S + x]) continue;
    const nx = (x - cx) / r, ny = (y - cy) / r;
    const l = -0.55 * nx - 0.75 * ny + (rnd() - 0.5) * 0.25;
    D.p(g, x, y, l > 0.5 ? pal.hi : l < -0.38 ? pal.sh : pal.base);
  }
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    if (m[y * S + x]) continue;
    const n = (xx, yy) => xx >= 0 && yy >= 0 && xx < S && yy < S && m[yy * S + xx];
    if (n(x + 1, y) || n(x - 1, y) || n(x, y + 1) || n(x, y - 1)) D.p(g, x, y, pal.line);
  }
  return { img: c, S, cx, cy };
}
function sparkeeBodies(r, seed) {
  const k = r + ':' + seed;
  if (!SPK_CACHE[k]) SPK_CACHE[k] = { bright: genSparkee(r, seed, false), dim: genSparkee(r, seed, true) };
  return SPK_CACHE[k];
}

  }

  update(dt) {
    this.t += dt;

    if (this.blinkT < 0) { this.blinking = 0.12; this.blinkT = 1.5 + Math.random() * 3.5; }

        const f = this.onArrive; this.onArrive = null; if (f) f();

    }

function stageToWorld(e) {

// ===================== Loop =====================
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now; T += dt;
  if (scene) {
    zoe.update(dt);
    for (const a of scene.actors || []) if (a !== zoe) a.update(dt);
    if (scene.update) scene.update(dt);
  }
  updateParticles(dt);
  Dlg.update(dt);
  updateBubbles();
  render();
  requestAnimationFrame(frame);
}
function render() {
  const g = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = C.ink2; g.fillRect(0, 0, W, H);
  if (!scene) return;
  g.save();
  if (FX.zoom) { const z = FX.zoom; g.translate(z.cx, z.cy); g.scale(z.k, z.k); g.translate(-z.cx, -z.cy); }
  g.translate(-Math.round(cam.x), -Math.round(cam.y));
  scene.drawBg && scene.drawBg(g);
  drawParticles(g, 'back');
  const actors = (scene.actors || []).slice().sort((a, b) => a.y - b.y);
  for (const a of actors) a.draw(g);
  drawParticles(g, 'mid');
  scene.drawFg && scene.drawFg(g);
  drawParticles(g, 'front');

  if (FX.flash > 0) { g.globalAlpha = FX.flash; g.fillStyle = FX.flashColor; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }

function planksV(g, x, y, w, h, pw, cols, rnd, nails = true) {
  let xx = x;

    const ww = Math.min(pw + (rnd() < 0.35 ? (rnd() < 0.5 ? -1 : 1) : 0), x + w - xx);

function drawFlight(g, x0, y0, x1, y1) {
  const dir = x1 > x0 ? 1 : -1, len = Math.abs(x1 - x0), steps = Math.round(len / 7), rise = (y0 - y1) / steps;

  D.line(g, x0, y0 + 12, x1, y1 + 12, C.ink2);

}

function drawFire(g, x, y, t, k) {
  if (k <= 0) return;
  const rows = 22;
  for (let i = 0; i < rows; i++) {
    const yy = y - i;
    const w = Math.max(0, (12 - i * 0.45 + Math.sin(t * 9 + i * 0.7) * 2.2) * k);
    const off = Math.sin(t * 6 + i * 0.5) * (i * 0.15);
    const c = i < 4 ? '#FFF6C8' : i < 9 ? '#FFD84A' : i < 15 ? '#FE9B5B' : '#C97034';
    if (w > 0.5) D.r(g, x - w + off, yy, w * 2, 1, c);
    if (i < 12 && w > 3) D.r(g, x - w * 0.4 + off, yy, w * 0.8, 1, i < 6 ? '#FFFFFF' : '#FFF6C8');
  }
  // tongues
  for (let j = 0; j < 4; j++) {
    const fx = x - 8 + j * 5 + Math.sin(t * 4 + j) * 1.5, h = (6 + ((Math.sin(t * 7 + j * 2) + 1) * 4)) * k;
    for (let i = 0; i < h; i++) D.p(g, fx + Math.sin(t * 10 + i + j) * 0.8, y - 14 * k - i, i < h / 2 ? '#FE9B5B' : '#C97034');
  }
  D.glow(g, x, y - 6, 60, '#FF9A3A', 0.3 * k * (0.9 + 0.1 * Math.sin(t * 13)), 5);
}

function streamMagic(from, to, n, opts = {}) {
  const [sx, sy] = from;
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      const p0 = [sx + (Math.random() - 0.5) * 10, sy + (Math.random() - 0.5) * 8];
      const p1 = [lerp(sx, to[0], 0.5) + (Math.random() - 0.5) * 50, Math.min(sy, to[1]) - 30 - Math.random() * 30];
      const p = { kind: 'glyph', gi: Math.floor(Math.random() * GLYPHS.length), p0, p1, p2: [to[0] + (Math.random() - 0.5) * 16, to[1] + (Math.random() - 0.5) * 8], life: 1.2 + Math.random() * 0.5, layer: 'front' };
      if (opts.colors) p.blob = opts.colors[i % opts.colors.length];
      emit(p);
      if (i % 6 === 0) AU.sfx('blip', 900 + Math.random() * 600);
    }, i * (opts.gap || 45));
  }
  return sleep(n * (opts.gap || 45) + 1500);
}

function drawReveal(g, drabC, aliveC, cx, cy, r) {
  if (r >= 340) { g.drawImage(aliveC, 0, 0); return; }
  g.drawImage(drabC, 0, 0);
  if (r <= 0) return;
  for (let y = 0; y < H; y++) {
    const dy = y - cy; if (Math.abs(dy) >= r) continue;
    const dx = Math.round(Math.sqrt(r * r - dy * dy));
    const x0 = Math.max(0, cx - dx), x1 = Math.min(W, cx + dx);
    if (x1 > x0) g.drawImage(aliveC, x0, y, x1 - x0, 1, x0, y, x1 - x0, 1);
  }
  for (let i = 0; i < 3; i++) { const a = Math.random() * Math.PI * 2; emit({ kind: 'spark', x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, vy: -10, life: 0.6, c: '#FFF6B8', layer: 'front' }); }
}

  const btn = h('button', { class: 'big', type: 'button' }, 'Lovely');
  const node = card('artcard',
    h('div', { class: 'aframe' }, pic),
    h('div', { class: 'binfo' },
      h('div', { class: 'ckicker' }, 'In the art studio'),
      h('h2', {}, q.title),
      h('p', {}, `By ${save.name === 'Visitor' ? 'the Visitor' : 'Zoe'}.`),
      lines.map((t) => h('p', {}, t)),
      h('p', { class: 'qaside' }, '(Dot rating: magnificent. Dot only has one rating.)'),
      btn));
  btn.addEventListener('click', () => { AU.sfx('tap'); Modal.close(); });
  await Modal.show(node, 'dim');
}
// take a picture of real art and turn it into pixel art
function openPhotoModal(q) {
  return new Promise((resolve) => {
    const input = h('input', { type: 'file', accept: 'image/*', capture: 'environment', class: 'hiddenfile' });
    const area = h('div', { class: 'pharea' });
    const btns = h('div', { class: 'qbtns' });
    const take = h('button', { class: 'big', type: 'button' }, pixImg(ICONS.e_camera, 0.8, 'inl'), ' Take a picture');
    const skip = h('button', { class: 'ghostbtn', type: 'button' }, 'Skip the picture');
    const node = card('photo', h('div', { class: 'qkicker' }, 'Show Dot'), h('h2', {}, q.title), area, btns, input);
    const reset = () => {
      area.innerHTML = '';
      area.append(h('div', { class: 'phempty' }, pixImg(ICONS.e_camera, 2.6), h('p', {}, 'Hold your art up flat, in good light.')));
      btns.innerHTML = ''; btns.append(take, skip);
    };
    take.addEventListener('click', () => { AU.sfx('tap'); input.value = ''; input.click(); });
    skip.addEventListener('click', () => { AU.sfx('tap'); Modal.close(null); });
    input.addEventListener('change', () => {
      const f = input.files && input.files[0]; if (!f) return;
      area.innerHTML = ''; area.append(h('p', { class: 'phwait' }, 'Dot is looking...'));
      const url = URL.createObjectURL(f);
      const img = new Image();
      img.onload = () => {
        let res;
        try { res = photoToArt(img); } catch (e) { console.error(e); reset(); return; }
        URL.revokeObjectURL(url);
        const small = h('img', { class: 'phpix', src: res.pix, alt: 'Your art as pixel art' });
        const real = h('img', { class: 'phreal', src: res.photo, alt: 'Your photo' });
        area.innerHTML = '';
        area.append(h('div', { class: 'phpair' }, h('figure', {}, real, h('figcaption', {}, 'Your art')), h('span', { class: 'pharrow', 'aria-hidden': 'true' }, '→'), h('figure', {}, small, h('figcaption', {}, 'In the treehouse'))));
        const use = h('button', { class: 'big', type: 'button' }, 'Show Dot!');
        const again = h('button', { class: 'ghostbtn', type: 'button' }, 'Try again');
        use.addEventListener('click', () => { AU.sfx('sparkle'); Modal.close(res); });
        again.addEventListener('click', () => { AU.sfx('tap'); input.value = ''; input.click(); });
        btns.innerHTML = ''; btns.append(use, again);
      };
      img.onerror = () => { reset(); area.prepend(h('p', { class: 'phwait' }, "Hmm, that picture didn't work. Try again?")); };
      img.src = url;
    });
    reset();
    Modal.show(node, 'dim').then(resolve);
  });
}

    h('div', { class: 'srow' }, pixImg(ICONS.e_floss, 1.5), h('div', { class: 'sinfo' }, h('div', { class: 'sname' }, 'Floss'), h('div', { class: 'sstat' }, h('span', {}, 'Today ', mark(t.floss)))), h('div', { class: 'sbtns' }, bFloss)),

// ===================== Title & boot =====================
function routeByStage() {
  const s = save.stage;
  if (s === 'new' || s === 'hallway') return goScene('hall');
  if (s === 'stairs') return goScene('stairs', { arrive: false });
  if (s === 'forest' || s === 'met') return goScene('forest');
  if (s === 'done' && save.lastRoom === 'studio' && save.flags.hatch) return goScene('studio');
  if (s === 'done' && save.lastRoom === 'bath' && save.flags.hatch) return goScene('bath');
  return goScene('library');
}
function showTitle() {
  goScene('title');
  const t = $('#title');
  t.hidden = false;
  const has = save.stage !== 'new';
  $('#bStart').textContent = has ? 'Keep playing' : 'Tap to begin';
  $('#bNew').hidden = !has;
  $('#confirm').hidden = true;
}
function begin() {
  AU.init(); Voice.unlock();
  if (save.musicOn === false) AU.setMusic(false);
  $('#title').hidden = true;
  zoe.rebuild();
  routeByStage();
}
function boot() {
  loadSave();
  migrateSave();
  AU.musicOn = save.musicOn !== false;
  makeIcons();
  for (const [k] of ANIMALS) ICONS['a_' + k] = animalIcon(k);
  makeIcons2();
  zoe.rebuild();
  mountHud();
  layout();
  $('#bStart').addEventListener('click', (e) => { e.stopPropagation(); begin(); });
  $('#title').addEventListener('pointerdown', (e) => { if (!e.target.closest('button')) { AU.init(); } });
  $('#bNew').addEventListener('click', (e) => { e.stopPropagation(); $('#confirm').hidden = false; $('#tbtns').hidden = true; });
  $('#bYes').addEventListener('click', (e) => { e.stopPropagation(); wipeSave(); migrateSave(); for (const k in BG) if (k.startsWith('forest')) delete BG[k]; $('#tbtns').hidden = false; begin(); });
  $('#bNo').addEventListener('click', (e) => { e.stopPropagation(); $('#confirm').hidden = true; $('#tbtns').hidden = false; });
  $('#bAnyway').addEventListener('click', () => { playAnyway = true; layout(); });
  document.addEventListener('visibilitychange', () => {
    if (!AU.ctx) return;
    if (document.hidden) AU.ctx.suspend(); else AU.ctx.resume();
  });
  showTitle();
  requestAnimationFrame(frame);
  window.__dbg = { save, goScene, SCENES, zoe, persist, begin, get scene() { return scene; }, get busy() { return isBusy(); }, Dlg, Modal };
}
boot();
